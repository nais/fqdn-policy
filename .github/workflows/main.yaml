name: Build and deploy
on:
  push:
    paths-ignore:
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURE_NAME: "fqdn-policy"
  FEATURE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais/feature

permissions:
  contents: "read"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # ratchet:jdx/mise-action@v4
      - run: mise run check
      - run: mise run test

  build_and_push:
    if: github.ref == 'refs/heads/main'
    needs:
      - tests
    permissions:
      id-token: "write"
      packages: "write"
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # ratchet:jdx/mise-action@v4
      - id: go_version
        run: echo "go_version=$(mise current go)" >> $GITHUB_OUTPUT

      - uses: nais/platform-build-push-sign@07a21e2293624a78499c79eeea3ce6d314f8a8d9 # ratchet:nais/platform-build-push-sign@main
        id: build_push_sign
        with:
          name: ${{ env.FEATURE_NAME }}
          google_service_account: gh-${{ env.FEATURE_NAME }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
          push_ghcr: true
          build_args: |
            GO_VERSION=${{ steps.go_version.outputs.go_version }}

      - name: Package chart
        id: package_chart
        env:
          CHART_PATH: ./charts
        run: |
          chart_version="$(yq '.version' < "${{ env.CHART_PATH }}/Chart.yaml")-${{ steps.build_push_sign.outputs.version }}"

          yq e -i '.version="'"$chart_version"'"' "${{ env.CHART_PATH }}/Chart.yaml"
          yq e -i '.image.tag="${{ steps.build_push_sign.outputs.version }}"' "${{ env.CHART_PATH }}/values.yaml"

          helm package "${{ env.CHART_PATH }}" --destination .

          name=$(yq '.name' < "${{ env.CHART_PATH }}/Chart.yaml")
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$chart_version" >> $GITHUB_OUTPUT
          echo "archive=$name-$chart_version.tgz" >> $GITHUB_OUTPUT

      - name: Push Chart
        run: |-
          chart="${{ steps.package_chart.outputs.archive }}"
          echo "Pushing: $chart"
          helm push "$chart" ${{ env.FEATURE_REPOSITORY }}
    outputs:
      version: ${{ steps.package_chart.outputs.version }}

  deploy:
    name: Deploy
    needs:
      - build_and_push
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4.1.1
        with:
          chart: ${{ env.FEATURE_REPOSITORY }}/${{ env.FEATURE_NAME }}
          version: ${{ needs.build_and_push.outputs.version }}
          targets: |
            [
              { "target": { "kind": "tenant", "tenant": "ci-nais" }, "wait": true },
              { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
              { "target": { "kind": "tenant" } },
              { "target": { "kind": "management" } }
            ]
